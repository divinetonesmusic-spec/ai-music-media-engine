#
# SEMÂNTICA DOS MARCADORES
#   NEEDS_INPUT  = o proprietário ainda precisa DECIDIR este valor.
#                  Nunca deve ser usado UNKNOWN para uma decisão estratégica.
#   UNKNOWN      = reservado para FATOS que não existem nas fontes
#                  (ex.: nº de seguidores de uma playlist). Não aparece neste
#                  formulário porque aqui só há decisões estratégicas + fatos já
#                  disponíveis.
#   ""           = campo de texto livre (notes) ainda sem conteúdo.
#
# COMO PREENCHER
#   - Substitua cada NEEDS_INPUT pelo valor decidido.
#   - primary_cluster: um nome de cluster (existente ou proposto).
#   - secondary_clusters / hero_artists: listas YAML, ex.: [sleep, healing].
#   - hero_artist: true | false.
#   - language: pt | es | en   (mercados linguísticos do V1 — business-dna §8).
#   - market: string de mercado nomeada (ex.: Brazil, Spanish-speaking LATAM, US, Global).
#   - priority (playlists): high | medium | low   (definição do proprietário).
#   - purpose / positioning: texto curto.
#   - Deixe como NEEDS_INPUT o que ainda não foi decidido — não invente.
#
# REGRAS
#   - IDs e nomes foram preservados EXATAMENTE como aparecem nos inventários.
#   - Nenhum cluster/idioma/mercado/posicionamento/artista-herói foi inferido.
#   - Apenas ativos PRÓPRIOS estão listados (páginas concorrentes/referência foram excluídas).
#   - Relacionado: TECHNICAL-SPEC-V1 §15 (Unknown / Needs Input Semantics), decisão I1.
#
# MODELO ESTRATÉGICO DE ARTISTA (decisão do proprietário, 2026-08-27)
#   - primary_cluster / secondary_clusters = AFINIDADE DE CATÁLOGO: o tema predominante
#     ou o contexto editorial observado no catálogo do artista. NÃO é restrição.
#   - Qualquer artista pode ser posicionado em qualquer cluster/playlist quando isso
#     fizer parte da estratégia. Afinidade de catálogo não limita participação.
#   - hero_artist é uma classificação ESTRATÉGICA INDEPENDENTE de primary_cluster.
#   - Não concluir que um artista "não serve" para uma oportunidade só porque o
#     catálogo dele tem afinidade com outro cluster.
#   - Distinguir: catalog affinity vs. playlist placement vs. strategic hero status
#     (ver business-dna.md §10-§11).
#
# APÓS PREENCHER
#   Este arquivo será a fonte da classificação estratégica que o Market Intelligence
